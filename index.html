<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>香港錢幣配對訓練_輕觸自動掃描版</title>
    <style>
        :root { 
            --primary: #007AFF; 
            --success: #28a745; 
            --danger: #dc3545; 
            --gaze: #ffeb3b; 
            --bg-color: #000000; 
            --card-white: #ffffff;
        }
        
        * { -webkit-touch-callout: none; -webkit-user-select: none; box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg-color); font-family: -apple-system, sans-serif; position: fixed; }
        
        /* 🔓 設定面板：解鎖 iPad 絲滑滾動 */
        #settings-panel { 
            position: fixed; inset: 0; background: #1a1a1a; z-index: 2000; padding: 30px; 
            overflow-y: scroll; 
            -webkit-overflow-scrolling: touch; 
            touch-action: pan-y; 
            color: white; 
        }
        .setting-item { margin-bottom: 25px; border-bottom: 1px solid #444; padding-bottom: 15px; }
        .btn-group { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 10px; }
        
        .btn { padding: 18px 28px; border: 3px solid #555; border-radius: 15px; background: #333; color: white; font-size: 1.4rem; cursor: pointer; transition: all 0.2s; }
        .btn.active { border-color: var(--primary); background: var(--primary); font-weight: bold; transform: scale(1.02); }
        
        #start-btn { width: 100%; background: var(--success); color: white; padding: 25px; font-size: 2.2rem; border-radius: 20px; border: none; margin-top: 20px; margin-bottom: 60px; font-weight: bold; cursor: pointer; box-shadow: 0 8px 20px rgba(40,167,69,0.4); }

        /* 遊戲介面 */
        #ui-header { position: fixed; top: 0; width: 100%; height: 90px; background: #1a1a1a; display: none; justify-content: space-between; align-items: center; padding: 0 30px; z-index: 100; border-bottom: 2px solid #333; color: white; }
        
        #game-area { display: flex; justify-content: center; align-items: center; gap: 80px; width: 100vw; height: 100vh; padding-top: 90px; position: relative; touch-action: none; }
        
        .match-card { 
            position: relative; 
            width: 460px; 
            height: 340px; 
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--card-white); 
            border-radius: 35px; 
            box-shadow: 0 0 40px rgba(255,255,255,0.15); 
            border: 12px solid transparent;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            /* 讓滑鼠游標在遊戲卡片上顯示，但變成手勢指標 */
            cursor: pointer; 
        }
        
        .match-card img { max-width: 85%; max-height: 85%; object-fit: contain; pointer-events: none; }
        .progress-bar { position: absolute; bottom: -12px; left: 0; width: 0%; height: 20px; background: var(--gaze); border-radius: 10px; box-shadow: 0 0 20px var(--gaze); }

        .match-card.correct-center {
            position: absolute !important; left: 50% !important; top: 50% !important;
            transform: translate(-50%, -50%) scale(1.35) !important;
            border-color: var(--success) !important;
            z-index: 1000 !important;
            box-shadow: 0 0 60px rgba(40,167,69,0.6);
        }
        .match-card.fade-out { opacity: 0; transform: scale(0.5); pointer-events: none; }

        #next-btn {
            display: none;
            position: fixed;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            padding: 20px 60px;
            font-size: 2.2rem;
            background: rgba(40, 167, 69, 0.95);
            color: white;
            border: 3px solid white;
            border-radius: 50px;
            cursor: pointer;
            z-index: 3000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: 0.2s;
            font-weight: bold;
        }
        #next-btn:active { transform: translateX(-50%) scale(0.95); }
    </style>
</head>
<body>

<div id="settings-panel">
    <h1 style="text-align:center; font-size: 2.5rem; margin-top: 10px;">💰 視覺認知訓練：錢幣篇</h1>
    <div class="setting-item">
        <h3>1. 難度等級</h3>
        <div class="btn-group">
            <button class="btn lv-btn active" data-lv="1">Lv 1: 單一目標</button>
            <button class="btn lv-btn" data-lv="2">Lv 2: 辨識有無 (空白格)</button>
            <button class="btn lv-btn" data-lv="3">Lv 3: 錢幣 vs 衣物</button>
            <button class="btn lv-btn" data-lv="4">Lv 4: 錢幣 2選1</button>
        </div>
    </div>
    <div class="setting-item">
        <h3>2. 注視/載入時間 (Dwell Time)</h3>
        <div class="btn-group">
            <button class="btn dwell-btn" data-ms="500">快速 (0.5s)</button>
            <button class="btn dwell-btn active" data-ms="1000">標準 (1.0s)</button>
            <button class="btn dwell-btn" data-ms="2000">慢速 (2.0s)</button>
        </div>
    </div>
    <div class="setting-item">
        <h3>3. 訓練面額</h3>
        <div class="btn-group">
            <button class="btn coin-btn active" data-val="10">$10 蚊</button>
            <button class="btn coin-btn active" data-val="20">$20 蚊</button>
            <button class="btn coin-btn active" data-val="50">$50 蚊</button>
            <button class="btn coin-btn active" data-val="100">$100 蚊</button>
        </div>
    </div>
    <button id="start-btn" onclick="startGame()">✅ 開始訓練</button>
</div>

<div id="ui-header">
    <button onclick="location.reload()" style="padding:12px 25px; background:#333; color:white; border:none; border-radius:10px; font-size:1.2rem; cursor:pointer;">🏠 返回選單</button>
    <div style="font-size: 2.5rem; font-weight: bold;">請找出：<span id="target-name" style="color:var(--gaze);">---</span></div>
    <div style="width:100px;"></div>
</div>

<div id="game-area"></div>
<button id="next-btn" onclick="triggerNextLevel()">下一題 (或等待自動跳轉)</button>

<script>
    let config = { lv: 1, dwell: 1000, coins: ['10','20','50','100'] };
    let timer = null;
    let autoNextTimeout = null;
    let isTransitioning = false;
    let actionLock = false; 

    const money = {
        '10': { name: '十蚊', file: '10.png' },
        '20': { name: '二十蚊', file: '20.png' },
        '50': { name: '五十蚊', file: '50.png' },
        '100': { name: '一百蚊', file: '100.png' }
    };
    const clothes = [
        { name: '帽子', file: 'cap.png' }, { name: '長褲', file: 'pant.png' },
        { name: '鞋子', file: 'shoes.png' }, { name: '襪子', file: 'sock.png' },
        { name: '衣服', file: 'tee.png' }
    ];

    document.querySelectorAll('.lv-btn').forEach(b => b.onclick = () => {
        document.querySelectorAll('.lv-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active'); config.lv = parseInt(b.dataset.lv);
    });
    document.querySelectorAll('.dwell-btn').forEach(b => b.onclick = () => {
        document.querySelectorAll('.dwell-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active'); config.dwell = parseInt(b.dataset.ms);
    });
    document.querySelectorAll('.coin-btn').forEach(b => b.onclick = () => {
        b.classList.toggle('active');
        config.coins = Array.from(document.querySelectorAll('.coin-btn.active')).map(x => x.dataset.val);
    });

    function speak(text) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'zh-HK';
        window.speechSynthesis.speak(msg);
    }

    function startGame() {
        document.getElementById('settings-panel').style.display = 'none';
        document.getElementById('ui-header').style.display = 'flex';
        nextLevel();
    }

    function triggerNextLevel() {
        clearTimeout(autoNextTimeout);
        nextLevel();
    }

    function nextLevel() {
        isTransitioning = false;
        actionLock = false;
        document.getElementById('next-btn').style.display = 'none';
        const area = document.getElementById('game-area');
        area.innerHTML = '';
        
        if (config.coins.length === 0) { alert("請先選擇訓練面額"); location.reload(); return; }

        const targetId = config.coins[Math.floor(Math.random() * config.coins.length)];
        const target = money[targetId];
        document.getElementById('target-name').innerText = target.name;
        speak("請找出" + target.name);

        let options = [];
        if (config.lv === 1) {
            options = [{ data: target, isCorrect: true, type: 'img' }];
        } else if (config.lv === 2) {
            options = [{ data: target, isCorrect: true, type: 'img' }, { data: null, isCorrect: false, type: 'empty' }];
        } else if (config.lv === 3) {
            options = [{ data: target, isCorrect: true, type: 'img' }, { data: clothes[Math.floor(Math.random() * clothes.length)], isCorrect: false, type: 'img' }];
        } else {
            const others = Object.keys(money).filter(id => id !== targetId);
            const otherId = others[Math.floor(Math.random() * others.length)];
            options = [{ data: target, isCorrect: true, type: 'img' }, { data: money[otherId], isCorrect: false, type: 'img' }];
        }

        options.sort(() => Math.random() - 0.5).forEach(opt => {
            const card = document.createElement('div');
            card.className = 'match-card';
            card.innerHTML = opt.type === 'img' ? `<img src="${opt.data.file}"><div class="progress-bar"></div>` : `<div class="progress-bar"></div>`;

            // 💡 【核心修改】：滑鼠移入或手指碰到，立刻「自動開始」並鎖定跑條
            const startScan = (e) => {
                if (e) {
                    // 如果是 iPad 觸控手勢，防止衍生事件觸發
                    if (e.type === 'touchstart') e.preventDefault();
                }
                
                if (isTransitioning || actionLock) return;

                actionLock = true; // 只要碰到了就鎖定狀態，防止抖動或移開導致斷掉
                card.style.borderColor = "var(--gaze)";
                const bar = card.querySelector('.progress-bar');
                bar.style.transition = `width ${config.dwell}ms linear`;
                bar.style.width = "100%";
                
                timer = setTimeout(() => {
                    if (opt.isCorrect) {
                        isTransitioning = true;
                        speak("答啱喇");
                        document.querySelectorAll('.match-card').forEach(c => { if (c !== card) c.classList.add('fade-out'); });
                        card.classList.add('correct-center');
                        
                        document.getElementById('next-btn').style.display = 'block';

                        autoNextTimeout = setTimeout(() => {
                            if (isTransitioning) nextLevel();
                        }, 3500);
                    } else {
                        // 答錯機制
                        card.style.borderColor = "var(--danger)";
                        bar.style.backgroundColor = "var(--danger)";
                        speak(opt.type === 'empty' ? "呢度係空嘅" : "唔係呢個");
                        
                        // 1.2秒後恢復，允許測試下一個
                        setTimeout(() => {
                            if(!isTransitioning) {
                                card.style.borderColor = "transparent";
                                bar.style.transition = "none";
                                bar.style.width = "0%";
                                bar.style.backgroundColor = "var(--gaze)";
                                actionLock = false;
                            }
                        }, 1200);
                    }
                }, config.dwell);
            };

            // 監聽各種「碰觸」事件：滑鼠滑入（pointerenter）以及手指觸摸（touchstart）
            card.addEventListener('pointerenter', (e) => {
                // 排除部分不靈敏的觸控類型干擾，確保滑鼠移入時完美觸發
                if (e.pointerType === 'mouse' || e.pointerType === 'pen') startScan(e);
            });
            card.addEventListener('touchstart', startScan);

            area.appendChild(card);
        });
    }

    // 防止 iPad 整個畫面被上下拉扯
    document.addEventListener('touchmove', function(e) {
        const sp = document.getElementById('settings-panel');
        if (sp && sp.contains(e.target)) return; 
        if (e.cancelable) e.preventDefault();
    }, { passive: false });
</script>
</body>
</html>
